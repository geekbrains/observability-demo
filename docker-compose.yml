version: '3.8'

services:

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector:0.143.0
    restart: always
    volumes:
      - ./src/docker/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/otel-collector-config.yml
    command:
      - --config=/etc/otelcol-contrib/otel-collector-config.yml
    ports:
      - "1888:1888" # pprof extension
      - "8888:8888" # Prometheus metrics exposed by the Collector
      - "8889:8889" # Prometheus exporter metrics
      - "13133:13133" # health_check extension
#      - "4317:4317" # OTLP gRPC receiver, will use this one with jaeger
      - "4318:4318" # OTLP http receiverol
      - "55679:55679" # zpages extension
    depends_on:
      - jaeger-all-in-one
      - zipkin-all-in-one

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./src/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
#    extra_hosts:
#      - "host.docker.internal:192.168.1.9"

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3000:3000"

  # Jaeger
  jaeger-all-in-one:
    image: jaegertracing/all-in-one:latest
    restart: always
    ports:
      - "16686:16686"
      - "14268"
      - "14250"
      - "4319:4318"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_HTTP_ENABLED=true


  # Zipkin
  zipkin-all-in-one:
    image: openzipkin/zipkin:latest
    restart: always
    ports:
      - "9411:9411"

